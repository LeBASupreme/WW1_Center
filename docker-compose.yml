services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ww1user
      POSTGRES_PASSWORD: ww1pass
      POSTGRES_DB: ww1db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ww1user -d ww1db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
